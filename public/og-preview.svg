<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#152033"/>
      <stop offset="60%" stop-color="#081022"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f6c46a"/>
      <stop offset="100%" stop-color="#f97316"/>
    </radialGradient>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(246, 196, 106, 0.4)"/>
      <stop offset="70%" stop-color="rgba(56, 189, 248, 0.15)"/>
      <stop offset="100%" stop-color="rgba(3, 7, 18, 0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="240" r="210" fill="url(#aura)"/>

  <!-- Constellation lines -->
  <g stroke="#f6c46a" stroke-width="2.5" opacity="0.6" stroke-dasharray="4 4">
    <line x1="160" y1="170" x2="256" y2="240" />
    <line x1="352" y1="180" x2="256" y2="240" />
    <line x1="330" y1="340" x2="256" y2="240" />
    <line x1="180" y1="330" x2="256" y2="240" />
  </g>

  <!-- Constellation stars -->
  <circle cx="160" cy="170" r="8" fill="#ffffff" />
  <circle cx="352" cy="180" r="8" fill="#ffffff" />
  <circle cx="330" cy="340" r="8" fill="#ffffff" />
  <circle cx="180" cy="330" r="8" fill="#ffffff" />

  <!-- Central Zen Golden Circle -->
  <circle cx="256" cy="240" r="32" fill="url(#goldGlow)" />
  <circle cx="256" cy="240" r="64" fill="none" stroke="#f6c46a" stroke-width="3" opacity="0.5" />

  <!-- App Title -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="600" fill="#f6c46a" text-anchor="middle" letter-spacing="6">ZENSPACE</text>
</svg>
