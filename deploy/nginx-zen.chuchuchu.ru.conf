# Host Nginx — drop next to the chuchuchu.ru & lofi.chuchuchu.ru vhosts.
# After adding DNS A-record for zen.chuchuchu.ru:
#   ln -s /var/www/zenspace/deploy/nginx-zen.chuchuchu.ru.conf /etc/nginx/sites-available/zen.chuchuchu.ru
#   ln -s /etc/nginx/sites-available/zen.chuchuchu.ru /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d zen.chuchuchu.ru
#
# App container listens on 127.0.0.1:8089 (PORT=8089 in docker-compose).

server {
    listen 80;
    listen [::]:80;
    server_name zen.chuchuchu.ru;

    location / {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
